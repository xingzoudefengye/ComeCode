name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            npm_entry: "1"
          - os: windows-2022
            target: win-x64
            npm_entry: "0"
          - os: macos-14
            target: darwin-arm64
            npm_entry: "0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install dependencies
        working-directory: engine
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # 只构建 CLI 及其工作区依赖：`pnpm -r build` 会把桌面端与 web 一起构建，
      # 其中的 mock-cdn 远端资产下载对 CLI 分发包毫无贡献，却在 Windows runner 上
      # 挂死过（无进展 39 分钟后被 job 超时取消，见 release run 37778112941）。
      - name: Build CLI dependencies
        working-directory: engine
        run: pnpm --filter "@zcode/cli..." build

      # `comecode --web` 由 @zcode/server 托管 @zcode/web 静态产物，两者必须随包分发。
      # 仍然使用定向 filter：mock-cdn 下载属于桌面端构建，不能被 `pnpm -r build` 带进来。
      - name: Build web chat runtime
        working-directory: engine
        run: |
          pnpm --filter "@zcode/server..." build
          pnpm --filter @zcode/web build

      - name: Build shared runtime package
        working-directory: engine
        run: pnpm --filter @zcode/shared build

      - name: Build CLI SEA
        working-directory: engine
        run: pnpm build:sea

      - name: Package distribution
        run: node ../scripts/package-comecode-cli.mjs
        working-directory: engine
        env:
          COMECODE_SKIP_NPM_ENTRY: ${{ matrix.npm_entry == '1' && '0' || '1' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: comecode-${{ matrix.target }}
          path: |
            artifacts/comecode/*
          retention-days: 7

  publish-npm:
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - name: Publish platform runtimes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::未配置 NPM_TOKEN，跳过 npm 发布；GitHub Release 仍会正常生成。"
            exit 0
          fi
          shopt -s nullglob
          packages=(artifacts/*/comecode-runtime-*.tgz)
          ((${#packages[@]} > 0))
          for package in "${packages[@]}"; do npm publish "$package" --access public; done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish comecode entry package
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::未配置 NPM_TOKEN，跳过 npm 发布；GitHub Release 仍会正常生成。"
            exit 0
          fi
          package=$(find artifacts -type f -name 'comecode-*.tgz' ! -name 'comecode-runtime-*.tgz' -print -quit)
          test -n "$package"
          npm publish "$package" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body: |
            ## 🚀 安装方式

            ### 快速安装（推荐）

            **Linux / macOS**:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/xingzoudefengye/ComeCode/main/install.sh | bash
            ```

            **Windows (PowerShell)**:
            ```powershell
            iwr https://raw.githubusercontent.com/xingzoudefengye/ComeCode/main/install.ps1 | iex
            ```

            ### 手动下载

            从下方选择对应平台的压缩包下载（需要本机已安装 Node.js 24.14.0 或更高版本）：
            - `comecode-*-linux-x64.tar.gz` - Linux x64
            - `comecode-*-windows-x64.tar.gz` - Windows x64
            - `comecode-*-darwin-arm64.tar.gz` - macOS Apple Silicon

            解压后运行 `node comecode-*-\<platform\>/comecode.cjs --help`，或按上文脚本安装到 PATH。

            ### npm 安装

            ```bash
            npm install -g comecode
            ```

            如果该命令返回 404，说明尚未配置 npm 发布凭据，请先使用上面的安装脚本或手动下载。

            ## 📖 使用文档

            - [用户使用指南](https://github.com/xingzoudefengye/ComeCode/blob/main/docs/USER-GUIDE.md)
            - [开发环境搭建](https://github.com/xingzoudefengye/ComeCode/blob/main/docs/dev-setup.md)
